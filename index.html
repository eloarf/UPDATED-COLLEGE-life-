<!DOCTYPE html>
<html lang="en" data-theme="pink-lobby">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>College Life OS - Student Life & Academic RPG</title>
  <meta name="description" content="Single-user, offline-first mobile-friendly university life operating system with timetable, courses, exams, RPG quests, focus timer, habits, and GPA calculator." />
  <meta property="og:title" content="College Life OS - Student Life & Academic RPG" />
  <meta property="og:description" content="Single-user, offline-first mobile-friendly university life operating system with timetable, courses, exams, RPG quests, focus timer, habits, and GPA calculator." />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AASTU OS" />
  <meta name="theme-color" content="#7A2E4A" />

  <!-- Pre-render theme loader to prevent flash of wrong colours -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('college_os_theme') || 'pink-lobby';
        document.documentElement.setAttribute('data-theme', savedTheme);
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        var themeColors = {
          'pink-lobby': '#7A2E4A',
          'matcha-cream': '#4F7A0A',
          'blush-cocoa': '#5A3426',
          'chocolate-lime': '#2A1810',
          'midnight-plum': '#1E1020',
          'burgundy-velvet': '#260B15'
        };
        if (metaTheme && themeColors[savedTheme]) {
          metaTheme.setAttribute('content', themeColors[savedTheme]);
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts for Josefin Sans, Cormorant Garamond, and Nunito Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600&family=Josefin+Sans:wght@600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&display=swap" rel="stylesheet">
</head>
<body class="bg-surface text-main antialiased selection:bg-pink-300 selection:text-pink-900 overflow-x-hidden min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
