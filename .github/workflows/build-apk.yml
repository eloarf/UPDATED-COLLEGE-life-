name: Build Standalone Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose APK build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release-unsigned

  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Latest Source
        uses: actions/checkout@v4

      - name: Report Source Version
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Message: $(git log -1 --pretty=%s)"
          echo "Branch: $GITHUB_REF_NAME"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Tests
        run: npm test

      - name: Build Latest Frontend
        run: npm run build

      - name: Verify Frontend Build
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: Frontend build directory not found."
            exit 1
          fi
          ls -lah dist

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        run: |
          # Use GitHub-hosted Ubuntu runner pre-installed Android SDK
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(which sdkmanager || echo "")"
          fi
          echo "Using sdkmanager at: $SDKMANAGER"

          echo "Accepting Android SDK licenses..."
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          echo "Installing/verifying required Android SDK packages..."
          # Install API 36 if available via canary/preview channel 3 or stable channel
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --channel=3 "platforms;android-36" || \
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" || true

          # Ensure platform 35 and platform-tools are verified
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "platform-tools" || true

      - name: Sync Latest Frontend with Capacitor
        run: npx cap sync android

      - name: Verify Capacitor Web Assets
        run: |
          if [ ! -d "android/app/src/main/assets/public" ]; then
            echo "ERROR: Capacitor web assets were not generated."
            exit 1
          fi
          ls -lah android/app/src/main/assets/public

      - name: Prepare Android Build
        run: |
          chmod +x android/gradlew
          rm -rf android/app/build/outputs/apk
          mkdir -p staged-apk

      - name: Build Debug APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Unsigned Release APK
        if: ${{ github.event.inputs.build_type == 'release-unsigned' }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Stage Correct APK
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.build_type }}" = "debug" ] || [ -z "${{ github.event.inputs.build_type }}" ]; then
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            DEST="staged-apk/CollegeLifeOS-debug.apk"
          else
            APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
            DEST="staged-apk/CollegeLifeOS-release-unsigned.apk"
          fi

          if [ ! -f "$APK" ]; then
            echo "ERROR: Expected APK not found: $APK"
            find android/app/build/outputs/apk -type f || true
            exit 1
          fi

          cp "$APK" "$DEST"
          echo "Successfully staged:"
          ls -lh "$DEST"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CollegeLifeOS-${{ github.event.inputs.build_type || 'debug' }}-${{ github.run_number }}
          path: staged-apk/*.apk
          retention-days: 30
          if-no-files-found: error
