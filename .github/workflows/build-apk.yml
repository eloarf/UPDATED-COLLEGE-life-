name: Build Standalone Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release-unsigned
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: 'apk-build-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run Test Suite
        run: npm test

      - name: Build Production Frontend Bundle
        run: npm run build

      - name: Sync Frontend into Capacitor Android Project
        run: npx cap sync android

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK Command-Line Tools
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle Wrapper Executable Bit
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        if: "${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}"
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Android Unsigned Release APK
        if: "${{ github.event.inputs.build_type == 'release-unsigned' }}"
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Locate and Stage APK for Download
        id: stage_apk
        run: |
          mkdir -p staged-apk
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk staged-apk/CollegeLifeOS-debug.apk
            echo "apk_path=staged-apk/CollegeLifeOS-debug.apk" >> $GITHUB_OUTPUT
            echo "Found debug APK: $(ls -lh staged-apk/CollegeLifeOS-debug.apk)"
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk staged-apk/CollegeLifeOS-release-unsigned.apk
            echo "apk_path=staged-apk/CollegeLifeOS-release-unsigned.apk" >> $GITHUB_OUTPUT
            echo "Found release APK: $(ls -lh staged-apk/CollegeLifeOS-release-unsigned.apk)"
          else
            echo "Error: No APK file was generated in output directory!"
            find android/app/build/outputs/apk/ -type f || true
            exit 1
          fi

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CollegeLifeOS-Android-APK
          path: staged-apk/*.apk
          retention-days: 30
          if-no-files-found: error
